# GitHub actions workflow.
# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions

name: Build+Test CI

on: [pull_request, push]

jobs:
  glibc:
    strategy:
      matrix:
        cc: [gcc, clang]
        platform:
          - runner: ubuntu-24.04
            abi: -m64
          - runner: ubuntu-24.04
            abi: -m32
            multilib: gcc-multilib
          - runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.platform.runner }}
    env:
      CC: ${{ matrix.cc }} ${{ matrix.platform.abi }}
    steps:
    - name: Install dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome.sources /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update -q
        sudo apt-get install -qy build-essential gcc ${{ matrix.platform.multilib }} clang automake autoconf autoconf-archive libtool pax-utils

    - uses: actions/checkout@v4
      name: Checkout

    - name: Build
      run: |
        ./autogen.sh
        ./configure || { cat config.log; false; }
        make V=1
        make V=1 check || { cat tests/testsuite.log; false; }
        make V=1 distcheck

  musl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/386]
    container:
      image: alpine:latest
      options: --cap-add=SYS_PTRACE --platform=${{ matrix.platform }}
    steps:
      - name: Install dependencies
        run: apk add bash coreutils build-base automake autoconf autoconf-archive libtool pax-utils gawk sed git

      - name: Checkout
        uses: taiki-e/checkout-action@v1

      - name: Build
        run: |
          ./autogen.sh
          ./configure || { cat config.log; false; }
          make V=1
          make V=1 check || { cat tests/testsuite.log; false; }
